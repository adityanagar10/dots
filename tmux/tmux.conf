source-file ~/.config/tmux/tmux.reset.conf

# Ctrl+b is an awkward reach; Ctrl+Space is a single easy thumb press and
# doesn't collide with anything else in this setup. macOS's "select
# previous input source" shortcut also defaults to Ctrl+Space and will
# eat it before it ever reaches the terminal — disable that in System
# Settings > Keyboard > Keyboard Shortcuts > Input Sources if C-Space
# stops working again. C-@/C-2 are kept bound as a fallback in case that
# setting ever gets reset.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind -n C-@ send-prefix
bind -n C-2 send-prefix

unbind C-l
set-option -g default-terminal 'tmux-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'

# evil
set -g mouse on

set -gq allow-passthrough on
set -g visual-activity off

bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -sg escape-time 0            # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard

# vim mode yay
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# splits

unbind %
bind | split-window -h -c "#{pane_current_path}" 

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# status bar
set-option -g status-position bottom
set-option -g status-left-length 100
set-option -g status-right-length 100

# Disable automatic renaming and set-titles to remove hostname
set-option -g set-titles off
set-option -g allow-rename off

# Everforest Dark Hard palette, matching Ghostty's theme. Hex colors
# (not colourN) so the ANSI palette can't wash them out — colour0 is
# Everforest's grey #7a8478, which made the old bar low-contrast.
# Bar sits one step above the terminal bg (#1e2326) so it reads as a bar.
# Active window is a raised dark block (not a light one) so the
# claude-status dots (amber/yellow/green) stay legible on top of it.
set-option -g status-style 'bg=#232a2e,fg=#fffbef'
set-option -g window-status-style 'fg=#f2efdf,bg=#232a2e'
set-option -g window-status-current-style 'fg=#e6f5c8,bg=#4f5b58,bold'
set-option -g window-status-activity-style 'fg=#e69875,bg=#232a2e'
set-option -g window-status-separator ''
# #(...) shells out to claude-status.sh on every status refresh to append
# an amber dot when a claude process is running in that window's panes.
set-option -g window-status-format ' #I:#W #(~/.config/tmux/scripts/claude-status.sh #{window_id}) '
set-option -g window-status-current-format ' #I:#W #(~/.config/tmux/scripts/claude-status.sh #{window_id}) '
set-option -g status-left '#[fg=#1e2326,bg=#a7c080,bold] #S #[default] '
set-option -g status-right '#[fg=#1e2326,bg=#7fbbb3,bold] %H:%M '

# prompts, messages, copy-mode selection
set -g message-style 'fg=#1e2326,bg=#dbbc7f,bold'
set -g message-command-style 'fg=#dbbc7f,bg=#232a2e'
set -g mode-style 'fg=#1e2326,bg=#e69875'
set -g popup-border-style 'fg=#7fbbb3'
set -g display-panes-active-colour '#a7c080'
set -g display-panes-colour '#859289'


# pane borders
set -g pane-active-border-style 'fg=#a7c080,bg=default'
set -g pane-border-style 'fg=#414b50,bg=default'

# keymaps
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"
bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind d detach
bind-key C-n command-prompt -p "New session name:" "new-session -s '%%'"
# -d pins the popup's start directory to the invoking pane's actual cwd;
# without it, display-popup's directory isn't reliably tied to the pane
# where the key was pressed, so agent-new.sh's git checks could run
# somewhere unrelated (e.g. $HOME) and fail instantly.
bind-key A display-popup -E -w 60 -h 10 -d "#{pane_current_path}" "~/scripts/agent-new.sh"
bind-key X run-shell -b "~/scripts/agent-close.sh '#{session_name}' '#{pane_current_path}'"
bind-key L display-popup -E -w 60 -h 15 -d "#{pane_current_path}" "~/scripts/agent-link.sh '#{pane_current_path}'"
bind-key R command-prompt -I "#S" "rename-session '%%'"
bind-key , command-prompt -I "#W" "rename-window '%%'"
bind-key '?' display-popup -E -w 70 -h 20 "less -R ~/.config/cheatsheets/tmux.md"
bind-key = run-shell "~/scripts/tmux-equalize.sh '#{window_id}'"
bind-key G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind-key K display-popup -E -w 90% -h 90% "k9s"
# kew lives in its own detached session so music keeps playing when the
# popup is hidden. Pressing the key again inside the popup detaches it.
# detach-on-destroy is on for that session only, so quitting kew closes the
# popup instead of switching the client to another session (global is off).
bind-key m if-shell -F '#{==:#{session_name},kew}' \
  'detach-client' \
  'display-popup -E -w 80% -h 80% "TMUX= tmux new-session -A -s kew kew \; set status off \; set detach-on-destroy on"'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# Plugin configurations
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @sessionx-bind 'o'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# init tmux proj. manager
run '~/.tmux/plugins/tpm/tpm'
