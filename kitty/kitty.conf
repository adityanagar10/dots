allow_remote_control yes

# Send Option as Alt/Meta (kitty's default is off on macOS) so terminal
# tools that bind Alt-combos, like fzf's Alt+C, actually receive them
# instead of Option producing special characters (e.g. Option+C -> ç).
macos_option_as_alt yes

map super+u           set_background_opacity 1
map super+shift+u     set_background_opacity default
map super+shift+i     set_background_opacity 0.9

# Font picker: opens an overlay running the fzf-based picker script, which
# rewrites font_family in this file and reloads kitty live. There's no
# kitty remote-control command for font family (only font size), so the
# script edits this file directly + `kitty @ load-config`.
map super+shift+f     launch --type=overlay --hold=no bash ~/scripts/kitty-font-picker.sh

# font_family FiraCode Nerd Font Mono
# font_family JetBrainsMono Nerd Font Mono
# font_family Iosevka Nerd Font Mono
# font_family Hack Nerd Font Mono
font_family Comic Code Ligatures
font_size 16
# text_composition_strategy legacy was flattening Comic Code's distinctive
# hand-drawn strokes (kitty's "platform"/CoreText default renders it
# closer to how VS Code shows it) — left off intentionally. cell_width
# squeeze doesn't meaningfully affect this font's look, kept as-is.
modify_font cell_width 95%

shell_integration no-cursor
enable_audio_bell no

dynamic_background_opacity yes
hide_window_decorations yes
window_padding_width 10
window_padding_height 0
# window_margin_width 22 0 0 0
background_blur 10
placement_strategy top

cursor_trail 10
cursor_trail_start_threshold 0
shell_integration no-cursor
cursor_trail_decay 0.01 0.15
cursor_shape block
cursor_blink true

background_opacity 0.8
set_background_opacity 0.8
single_window_margin_width 0
# background_opacity 1.0

background_image ~/.config/kitty/wallpapers/europa-jupiter-moon.jpg
background_image_layout cscaled
background_tint 0.98
